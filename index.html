<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f3df" />
    <meta name="description" content="A playful learning meadow for little readers, number explorers, and curious minds." />
    <title>Little Trail | Play, read, and explore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Rounded+Display&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Little Trail home">
          <span class="brand-mark" aria-hidden="true">✿</span>
          <span>little trail</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-button is-active" data-view="home" title="My meadow"><span aria-hidden="true">⌂</span> My meadow</button>
          <button class="nav-button" data-view="math" title="Math trail"><span aria-hidden="true">＋</span> Math trail</button>
          <button class="nav-button" data-view="stories" title="Story nook"><span aria-hidden="true">▤</span> Story nook</button>
          <button class="nav-button" data-view="sounds" title="Sound garden"><span aria-hidden="true">♫</span> Sound garden</button>
          <button class="nav-button" data-view="discover" title="Find and say"><span aria-hidden="true">◉</span> Find & say</button>
          <button class="nav-button" data-view="paint" title="Paint and play"><span aria-hidden="true">✎</span> Paint</button>
        </nav>
        <div class="star-counter" aria-label="Stars collected">
          <span aria-hidden="true">★</span><strong id="star-count">0</strong><span class="star-label">stars</span>
        </div>
      </header>

      <main id="app-view" tabindex="-1"></main>

      <footer class="site-footer">
        <span>Little steps make a lovely trail.</span>
        <span>Made for curious minds <span aria-hidden="true">✿</span></span>
      </footer>
    </div>
    <div id="celebration" class="celebration" aria-live="polite" aria-atomic="true" hidden></div>
    <script src="fable-stories.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
