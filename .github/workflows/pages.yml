name: Deploy Little Trail to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir -p _site
          cp *.html *.js *.css _site/
          mkdir -p _site/assets/vegetables
          cp assets/vegetables/cauliflower.jpg assets/vegetables/candidate-carrot-1.jpg assets/vegetables/pumpkin.jpg assets/vegetables/bell-pepper.jpg assets/vegetables/okra.jpg assets/vegetables/celery.jpg assets/vegetables/potato.jpg assets/vegetables/cucumber.jpg assets/vegetables/broccoli.jpg _site/assets/vegetables/
          mkdir -p _site/assets/coloring
          cp assets/coloring/garden-friend.svg _site/assets/coloring/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4